syntax = "proto3";

package recommend;

option java_multiple_files = true;
option java_package = "com.simpledouyin.recommend.proto";
option java_outer_classname = "RecommendProto";

service RecommendService {
    rpc ListRecommendedVideos (ListRecommendedVideosRequest) returns (ListRecommendedVideosResponse);
    rpc ResetRecommendedHistory (ResetRecommendedHistoryRequest) returns (ResetRecommendedHistoryResponse);
    rpc ResetRecommendedVideoHistory (ResetRecommendedVideoHistoryRequest) returns (ResetRecommendedVideoHistoryResponse);
}

message ListRecommendedVideosRequest {
    string request_id = 1;
    int64 user_id = 2;
    string cursor = 3;
    int32 limit = 4;
    bool exclude_viewed = 5;
    string strategy = 6;
}

message ListRecommendedVideosResponse {
    repeated int64 video_ids = 1;
    string next_cursor = 2;
    bool has_more = 3;
    string strategy = 4;
    string debug_message = 5;
}

message ResetRecommendedHistoryRequest {
    string request_id = 1;
    int64 user_id = 2;
}

message ResetRecommendedHistoryResponse {
    bool reset = 1;
    int64 cleared_count = 2;
}

message ResetRecommendedVideoHistoryRequest {
    string request_id = 1;
    int64 user_id = 2;
    int64 video_id = 3;
}

message ResetRecommendedVideoHistoryResponse {
    int64 video_id = 1;
    bool reset = 2;
    int64 cleared_count = 3;
}
