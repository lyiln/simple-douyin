spring:
  application:
    name: simple-douyin-api-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/simple_douyin?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${API_SERVER_PORT:8080}

app:
  uploads:
    root: ${UPLOADS_DIR:uploads}
    public-path: /uploads/

recommend:
  grpc:
    host: ${RECOMMEND_GRPC_HOST:localhost}
    port: ${RECOMMEND_GRPC_PORT:9090}
