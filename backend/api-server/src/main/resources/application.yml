spring:
  application:
    name: simple-douyin-api-server
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:120MB}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/simple_douyin?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${API_SERVER_PORT:8080}

app:
  auth:
    token:
      secret: ${AUTH_TOKEN_SECRET:dev-only-change-this-token-secret}
      expires-in-seconds: ${AUTH_TOKEN_EXPIRES_IN_SECONDS:7200}
  uploads:
    root: ${UPLOADS_DIR:uploads}
    public-path: ${UPLOADS_PUBLIC_PATH:/uploads/}
    video-directory: ${UPLOADS_VIDEO_DIR:videos}
    cover-directory: ${UPLOADS_COVER_DIR:covers}
    max-video-size: ${UPLOADS_MAX_VIDEO_SIZE:100MB}
    max-cover-size: ${UPLOADS_MAX_COVER_SIZE:10MB}
    allowed-video-mime-types: ${UPLOADS_ALLOWED_VIDEO_MIME_TYPES:video/mp4}
    allowed-cover-mime-types: ${UPLOADS_ALLOWED_COVER_MIME_TYPES:image/jpeg,image/png,image/webp}
  request-log:
    max-body-length: ${REQUEST_LOG_MAX_BODY_LENGTH:16384}
    max-query-length: ${REQUEST_LOG_MAX_QUERY_LENGTH:1024}
    max-error-length: ${REQUEST_LOG_MAX_ERROR_LENGTH:1024}

recommend:
  grpc:
    host: ${RECOMMEND_GRPC_HOST:localhost}
    port: ${RECOMMEND_GRPC_PORT:9090}
